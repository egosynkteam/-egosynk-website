<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — EGOSYNK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0D0E10; --surface:#17181B; --surface-2:#1F2023; --line:#2A2B2F; --bone:#EDEAE3; --bone-dim:#A8A6A0; --steel:#8B8D93; --rust:#C41E3A; --rust-bright:#E63950; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--bone);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:60px 20px;}
  a{color:var(--rust-bright);}
  .logo{font-family:'Archivo Black',sans-serif;font-size:20px;text-transform:uppercase;margin-bottom:32px;}
  .logo span{color:var(--rust);}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:8px;max-width:400px;width:100%;padding:28px;}
  h1{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:20px;margin-bottom:6px;}
  .sub{color:var(--bone-dim);font-size:13px;margin-bottom:24px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--steel);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:6px;}
  .field input{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--bone);padding:12px;border-radius:2px;font-size:14px;}
  button[type=submit]{width:100%;background:var(--rust);color:var(--bone);border:none;padding:14px;border-radius:2px;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;font-size:13px;cursor:pointer;margin-top:6px;}
  .msg{font-size:13px;margin-bottom:14px;display:none;}
  .msg.error{color:var(--rust-bright);}
  .msg.success{color:#3FA96A;}
  .switch{margin-top:20px;font-size:13px;color:var(--bone-dim);text-align:center;}
</style>
</head>
<body>

<a href="/" class="logo"><span>EGO</span>SYNK</a>

<div class="card">
  <h1>Set New Password</h1>
  <div class="sub" id="sub">Choose a new password for your account.</div>
  <div class="msg" id="msg"></div>
  <form id="form">
    <div class="field">
      <label for="password">New Password</label>
      <input id="password" name="password" type="password" minlength="8" required>
    </div>
    <button type="submit" id="submitBtn">Set New Password</button>
  </form>
  <div class="switch"><a href="/login.html">Back to login</a></div>
</div>

<script>
const token = new URLSearchParams(window.location.search).get('token');
if(!token){
  document.getElementById('sub').textContent = 'No reset token found in this link.';
  document.getElementById('form').style.display = 'none';
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  msg.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Saving…';

  try{
    const res = await fetch('/.netlify/functions/reset-password', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ token, password: document.getElementById('password').value })
    });
    const result = await res.json();
    if(!res.ok){
      msg.className = 'msg error';
      msg.textContent = result.error || 'Could not reset password.';
      msg.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Set New Password';
      return;
    }
    msg.className = 'msg success';
    msg.textContent = 'Password updated. Redirecting to login…';
    msg.style.display = 'block';
    setTimeout(() => window.location.href = '/login.html', 1500);
  } catch(err){
    msg.className = 'msg error';
    msg.textContent = 'Something went wrong. Try again.';
    msg.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Set New Password';
  }
});
</script>
</body>
</html>
