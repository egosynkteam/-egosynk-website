<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D0E10">
<!--PRODUCT_HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Product page, server-rendered by netlify/functions/product-page.js. Tokens and nav
     match index.html. */
  :root{
    --bg:#0D0E10; --surface:#17181B; --surface-2:#1F2023; --line:#2A2B2F;
    --bone:#EDEAE3; --bone-dim:#A8A6A0; --steel:#8B8D93;
    --rust:#C41E3A; --rust-bright:#E63950; --rust-dim:#3D0F16; --ok:#3FA96A;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  @view-transition{navigation:auto;}
  *{margin:0;padding:0;box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{background:var(--bg);color:var(--bone);font-family:'Inter',sans-serif;overflow-x:hidden;}
  a{color:inherit;text-decoration:none;}
  .mono{font-family:'JetBrains Mono',monospace;letter-spacing:0.04em;}

  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
    padding:18px 24px;background:rgba(13,14,16,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .logo{font-family:'Archivo Black',sans-serif;font-size:20px;letter-spacing:0.02em;text-transform:uppercase;}
  .logo span{color:var(--rust);}
  .nav-right{display:flex;align-items:center;gap:18px;}
  .icon-btn{position:relative;border:1px solid var(--line);color:var(--bone);width:40px;height:40px;border-radius:2px;
    display:flex;align-items:center;justify-content:center;transition:border-color .2s;}
  .icon-btn:hover{border-color:var(--bone-dim);}
  .cart-count{position:absolute;top:-6px;right:-6px;background:var(--rust);color:var(--bone);font-size:10px;font-weight:700;
    width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .cart-count.bump{animation:bump .45s var(--ease);}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}

  main{max-width:1200px;margin:0 auto;padding:96px 24px 60px;}
  .crumbs{font-size:11px;color:var(--steel);margin-bottom:20px;text-transform:uppercase;letter-spacing:.08em;}
  .crumbs a:hover{color:var(--bone);}
  .pdp{display:grid;gap:32px;}
  @media(min-width:860px){.pdp{grid-template-columns:1.15fr 1fr;gap:56px;align-items:start;}}

  /* gallery: swipeable strip on phones, main image + thumbnails on desktop */
  .gallery-main{position:relative;aspect-ratio:1;background:linear-gradient(135deg,var(--surface-2),var(--bg));
    border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .gallery-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;}
  .gallery-track::-webkit-scrollbar{display:none;}
  .gallery-track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;}
  .gallery-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Black',sans-serif;font-size:56px;color:var(--line);}
  .gallery-dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;}
  .gallery-dots span{width:6px;height:6px;border-radius:50%;background:rgba(237,234,227,.35);transition:all .3s var(--ease);}
  .gallery-dots span.on{background:var(--bone);width:18px;border-radius:3px;}
  .thumbs{display:none;gap:10px;margin-top:12px;}
  @media(min-width:860px){.thumbs{display:flex;} .gallery-dots{display:none;}}
  .thumbs button{width:76px;height:76px;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--surface);
    cursor:pointer;padding:0;opacity:.6;transition:opacity .2s,border-color .2s;}
  .thumbs button.on,.thumbs button:hover{opacity:1;border-color:var(--rust);}
  .thumbs img{width:100%;height:100%;object-fit:cover;}
  .tag{position:absolute;top:12px;left:12px;z-index:1;background:var(--rust);color:var(--bone);font-family:'JetBrains Mono',monospace;
    font-size:10px;padding:4px 9px;border-radius:2px;text-transform:uppercase;}

  .info h1{font-family:'Archivo Black',sans-serif;font-size:clamp(26px,4vw,38px);text-transform:uppercase;line-height:1.08;margin-bottom:10px;}
  .info .cat{font-size:11px;color:var(--steel);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px;}
  .price-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .price{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:24px;}
  .mrp{font-family:'JetBrains Mono',monospace;color:var(--steel);text-decoration:line-through;font-size:15px;}
  .off{color:var(--ok);font-weight:700;font-size:13px;}
  .tax-note{font-size:11px;color:var(--steel);margin-bottom:22px;}
  .spec-chips{display:flex;flex-wrap:wrap;gap:8px;margin:-8px 0 22px;}
  .spec-chips span{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;padding:6px 10px;border:1px solid var(--line);border-radius:2px;color:var(--bone-dim);}
  .spec-chips .level{border-color:var(--rust);color:var(--bone);}
  .label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--steel);letter-spacing:0.08em;text-transform:uppercase;
    margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .link{color:var(--rust-bright);text-decoration:underline;cursor:pointer;background:none;border:none;font:inherit;font-size:11px;}
  .sizes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .size{min-width:48px;height:48px;padding:0 14px;border:1px solid var(--line);background:var(--surface);color:var(--bone);
    border-radius:2px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:13px;transition:border-color .15s,background .15s,transform .15s;}
  .size:hover{border-color:var(--bone-dim);}
  .size.on{border-color:var(--rust);background:var(--rust-dim);}
  .size:active{transform:scale(.96);}
  .size.out{opacity:.35;text-decoration:line-through;cursor:not-allowed;}
  .stock-note{font-size:12px;color:var(--rust-bright);min-height:18px;margin-bottom:14px;}
  .buy-row{display:flex;gap:10px;margin-bottom:12px;}
  .qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:2px;}
  .qty button{width:42px;height:52px;background:none;border:none;color:var(--bone);font-size:18px;cursor:pointer;}
  .qty span{min-width:24px;text-align:center;font-family:'JetBrains Mono',monospace;}
  .add-btn{flex:1;height:52px;background:var(--rust);color:var(--bone);border:none;border-radius:2px;font-weight:800;font-size:14px;
    letter-spacing:.06em;text-transform:uppercase;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,background .2s;}
  .add-btn:hover:not(:disabled){background:var(--rust-bright);}
  .add-btn:active:not(:disabled){transform:scale(.98);}
  .add-btn:disabled{background:var(--surface-2);color:var(--steel);cursor:not-allowed;}
  .save-btn{width:52px;height:52px;flex-shrink:0;background:none;border:1px solid var(--line);border-radius:2px;color:var(--bone);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .save-btn svg{width:20px;height:20px;}
  .save-btn.on{color:var(--rust-bright);border-color:var(--rust);}
  .save-btn.on svg{fill:currentColor;}
  .notify{border:1px dashed var(--line);border-radius:2px;padding:14px;margin:4px 0 14px;font-size:13px;color:var(--bone-dim);}
  .notify p{margin-bottom:10px;}
  .notify select{background:var(--surface-2);border:1px solid var(--line);color:var(--bone);padding:0 8px;border-radius:2px;font:inherit;font-size:13px;margin:0 4px;height:30px;}
  .inline-form{display:flex;gap:8px;}
  .inline-form input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);color:var(--bone);padding:10px 12px;border-radius:2px;font:inherit;font-size:14px;}
  .inline-form input:focus{outline:none;border-color:var(--rust);}
  .inline-form button{background:none;border:1px solid var(--rust);color:var(--bone);padding:0 16px;border-radius:2px;font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;white-space:nowrap;}
  .form-msg{font-size:12px;margin-top:8px;min-height:16px;}
  .form-msg.ok{color:#5FBF86;}
  .form-msg.err{color:var(--rust-bright);}
  .pin-check{margin:18px 0 0;}
  .pin-check .inline-form input{font-family:'JetBrains Mono',monospace;letter-spacing:.1em;}
  .pin-out{font-size:13px;color:var(--bone);margin-top:8px;min-height:18px;line-height:1.5;}
  .pin-out small{display:block;color:var(--steel);font-size:11px;}
  .perks{display:grid;gap:8px;margin:18px 0 26px;font-size:12px;color:var(--bone-dim);}
  .perks div{display:flex;gap:10px;align-items:center;}
  .perks svg{flex:none;color:var(--rust-bright);}
  .desc{font-size:14px;line-height:1.7;color:var(--bone-dim);white-space:pre-line;margin-bottom:16px;}
  .highlights{list-style:none;margin-bottom:24px;}
  .highlights li{font-size:13px;padding:6px 0 6px 18px;position:relative;border-bottom:1px solid var(--line);}
  .highlights li::before{content:'';position:absolute;left:0;top:13px;width:7px;height:7px;background:var(--rust);}
  details.acc{border-top:1px solid var(--line);}
  details.acc:last-of-type{border-bottom:1px solid var(--line);}
  details.acc summary{list-style:none;cursor:pointer;padding:16px 0;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;
    display:flex;justify-content:space-between;}
  details.acc summary::-webkit-details-marker{display:none;}
  details.acc summary::after{content:'+';color:var(--rust-bright);transition:transform .25s var(--ease);}
  details.acc[open] summary::after{transform:rotate(45deg);}
  details.acc p{font-size:13px;color:var(--bone-dim);line-height:1.7;padding-bottom:16px;}
  details.acc p a{color:var(--rust-bright);}

  /* sticky buy bar on phones, shown once the main button scrolls away */
  .sticky-buy{position:fixed;left:0;right:0;bottom:0;z-index:90;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:rgba(13,14,16,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;
    transform:translateY(110%);transition:transform .35s var(--ease);}
  .sticky-buy.show{transform:none;}
  .sticky-buy .price{font-size:18px;}
  .sticky-buy .add-btn{height:46px;}
  @media(min-width:860px){.sticky-buy{display:none;}}

  /* stars: a grey row with a red row clipped to the rating on top */
  .stars{position:relative;display:inline-block;font-size:14px;letter-spacing:2px;line-height:1;color:var(--line);}
  .stars::before{content:'★★★★★';}
  .stars span{position:absolute;inset:0;overflow:hidden;white-space:nowrap;color:var(--rust-bright);}
  .stars span::before{content:'★★★★★';}
  .rating-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--bone-dim);margin:-2px 0 12px;}
  .rating-line a{text-decoration:underline;}
  .reviews{margin-top:64px;scroll-margin-top:90px;}
  .reviews h2{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:24px;margin-bottom:20px;}
  .rev-top{display:grid;gap:24px;margin-bottom:28px;}
  @media(min-width:700px){.rev-top{grid-template-columns:240px 1fr auto;align-items:center;}}
  .rev-score{font-family:'Archivo Black',sans-serif;font-size:44px;line-height:1;}
  .rev-score small{font-family:'Inter',sans-serif;font-size:12px;color:var(--steel);display:block;margin-top:8px;font-weight:400;}
  .rev-bars div{display:grid;grid-template-columns:28px 1fr 28px;gap:8px;align-items:center;font-size:11px;color:var(--steel);margin:4px 0;}
  .rev-bars i{display:block;height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
  .rev-bars i b{display:block;height:100%;background:var(--rust-bright);}
  .ghost-btn{background:none;border:1px solid var(--bone-dim);color:var(--bone);padding:12px 18px;border-radius:2px;font-weight:700;font-size:12px;
    letter-spacing:.06em;text-transform:uppercase;cursor:pointer;}
  .ghost-btn:hover{border-color:var(--bone);}
  .rev{border-top:1px solid var(--line);padding:18px 0;}
  .rev-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .rev-head strong{font-size:14px;}
  .rev-meta{font-size:11px;color:var(--steel);}
  .rev p{font-size:13px;color:var(--bone-dim);line-height:1.65;white-space:pre-line;}
  .rev .verified{color:var(--ok);font-size:11px;font-weight:600;}
  .rev-reply{margin-top:10px;padding:10px 12px;border-left:2px solid var(--rust);background:var(--surface);font-size:12px;color:var(--bone-dim);}
  .rev-form{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px;margin-bottom:28px;display:grid;gap:12px;}
  .rev-form label{font-size:11px;color:var(--steel);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:6px;}
  .rev-form input,.rev-form textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--bone);padding:11px 12px;border-radius:2px;font:inherit;font-size:14px;}
  .rev-form input:focus,.rev-form textarea:focus{outline:none;border-color:var(--rust);}
  .rev-form .row{display:grid;gap:12px;}
  @media(min-width:700px){.rev-form .row{grid-template-columns:1fr 1fr;}}
  .star-pick{display:flex;gap:4px;}
  .star-pick button{background:none;border:none;font-size:28px;color:var(--line);cursor:pointer;padding:0 2px;transition:color .15s, transform .15s;}
  .star-pick button.on{color:var(--rust-bright);}
  .star-pick button:hover{transform:scale(1.12);}
  .rev-msg{font-size:13px;}
  .rev-msg.err{color:var(--rust-bright);} .rev-msg.ok{color:var(--ok);}
  .related{margin-top:72px;}
  .related h2{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:24px;margin-bottom:20px;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr);gap:18px;}}
  .card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:2px;overflow:hidden;transition:border-color .2s,transform .3s var(--ease);}
  .card:hover{border-color:var(--bone-dim);transform:translateY(-3px);}
  .card-img{aspect-ratio:1;position:relative;background:linear-gradient(135deg,var(--surface-2),var(--bg));overflow:hidden;
    display:flex;align-items:center;justify-content:center;font-family:'Archivo Black',sans-serif;font-size:24px;color:var(--line);}
  .card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease);}
  .card:hover .card-img img{transform:scale(1.04);}
  .card-body{padding:12px;}
  .card-body h3{font-size:13px;font-weight:600;margin-bottom:6px;line-height:1.35;}
  .card-body .price{font-size:14px;}

  footer{border-top:1px solid var(--line);padding:32px 24px 40px;margin-top:40px;font-size:12px;color:var(--steel);}
  footer .links{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:12px;}
  footer a:hover{color:var(--bone);}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--bone);color:var(--bg);padding:12px 16px;
    border-radius:3px;font-size:13px;font-weight:600;display:flex;gap:16px;align-items:center;opacity:0;pointer-events:none;
    transition:all .3s var(--ease);z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
  .toast a{color:var(--rust);text-decoration:underline;font-weight:800;}
  @media(max-width:859px){.toast{bottom:90px;}}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;pointer-events:none;transition:opacity .2s;}
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .size-modal{background:var(--bg);border:1px solid var(--line);border-radius:6px;max-width:420px;width:100%;padding:22px;}
  .size-modal h3{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:18px;}
  .size-modal .sub{font-size:11px;color:var(--steel);margin:4px 0 14px;text-transform:uppercase;letter-spacing:.08em;}
  .size-modal table{width:100%;border-collapse:collapse;font-size:13px;}
  .size-modal th,.size-modal td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;}
  .size-modal th{color:var(--steel);font-size:11px;text-transform:uppercase;}

  /* the "fly to bag" ghost */
  .fly{position:fixed;z-index:500;pointer-events:none;border-radius:4px;object-fit:cover;
    transition:transform .7s cubic-bezier(.5,-0.2,.3,1), opacity .7s ease;}

  /* entrance + scroll reveal */
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease), transform .7s var(--ease);transition-delay:calc(var(--i,0) * 70ms);}
  .reveal.in{opacity:1;transform:none;}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important;}
    .reveal{opacity:1;transform:none;}
    @view-transition{navigation:none;}
  }
</style>
</head>
<body>

<nav>
  <a class="logo" href="/"><span>EGO</span>SYNK</a>
  <div class="nav-right">
    <a class="icon-btn" href="/account.html" title="Account" aria-label="Account">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
    <a class="icon-btn" href="/#bag" id="bagBtn" title="Bag" aria-label="Bag">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-count" id="cartCount">0</span>
    </a>
  </div>
</nav>

<main id="main"></main>

<div class="sticky-buy" id="stickyBuy">
  <div><div class="price" id="stickyPrice"></div><div class="tax-note" style="margin:0" id="stickySize">Select a size</div></div>
  <button class="add-btn" id="stickyAdd" onclick="addToBag()">Add to bag</button>
</div>

<footer>
  <div class="links">
    <a href="/#shop">Shop</a><a href="/shipping-policy.html">Shipping</a><a href="/refund-policy.html">Returns &amp; Exchanges</a>
    <a href="/terms.html">Terms</a><a href="/privacy-policy.html">Privacy</a><a href="/contact.html">Contact</a><a href="#" onclick="window.egoCookieSettings&&egoCookieSettings();return false;">Cookie settings</a>
  </div>
  <div class="mono">© 2026 EGOSYNK.COM · GSTIN 27AKHPY6964E1ZI</div>
</footer>

<div class="toast" id="toast" role="status"></div>
<div class="modal-overlay" id="guideOverlay" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="size-modal" id="guideBody"></div>
</div>

<script>
const DATA = /*PRODUCT_DATA*/null;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function esc(str){ const d = document.createElement('div'); d.textContent = str == null ? '' : String(str); return d.innerHTML; }
const media = (k) => `/media/${encodeURIComponent(k)}`;
const inr = (n) => `₹${Number(n).toLocaleString('en-IN')}`;
const isFreeSize = (p) => p.sizes.length === 1 && /^free size$/i.test(p.sizes[0]);
const left = (p, size) => p.stockBySize && Number.isFinite(p.stockBySize[size]) ? p.stockBySize[size] : Infinity;
// Fit, compression level, fabric and weight from admin. Nothing renders when none is set.
function specChips(p){
  const s = p.specs || {};
  const level = { light: 'Light compression', medium: 'Medium compression', firm: 'Firm compression' }[s.compression];
  const chips = [
    s.fit && `<span>${esc(s.fit)}</span>`,
    level && `<span class="level">${level}</span>`,
    s.fabric && `<span>${esc(s.fabric)}</span>`,
    s.gsm && `<span>${Number(s.gsm)} GSM</span>`,
  ].filter(Boolean);
  return chips.length ? `<div class="spec-chips reveal" style="--i:4" aria-label="Product specs">${chips.join('')}</div>` : '';
}

function priceHtml(p){
  const off = p.mrp && p.mrp > p.price ? Math.round((1 - p.price / p.mrp) * 100) : 0;
  return `<span class="price">${inr(p.price)}</span>${off ? `<span class="mrp">${inr(p.mrp)}</span><span class="off">${off}% off</span>` : ''}`;
}

/* ---------- bag (shared with the homepage via localStorage) ---------- */
function readCart(){
  try{ return JSON.parse(localStorage.getItem('egosynk_cart') || sessionStorage.getItem('egosynk_cart') || '[]'); }
  catch(e){ return []; }
}
function writeCart(cart){
  try{ localStorage.setItem('egosynk_cart', JSON.stringify(cart)); } catch(e){ sessionStorage.setItem('egosynk_cart', JSON.stringify(cart)); }
}
function updateCount(bump){
  const el = document.getElementById('cartCount');
  el.textContent = readCart().reduce((s, c) => s + c.qty, 0);

// A copy of the product photo arcs into the bag icon, then the count bounces.
function flyToBag(){
  const src = document.querySelector('#track img');
  const target = document.getElementById('bagBtn').getBoundingClientRect();
  if(!src || reduceMotion){ updateCount(true); return; }
  const r = src.getBoundingClientRect();
  const ghost = Object.assign(document.createElement('img'), { src: src.src, className: 'fly', alt: '' });
  const size0 = Math.min(r.width, 160);
  Object.assign(ghost.style, { width: size0 + 'px', height: size0 + 'px', left: (r.left + r.width / 2 - size0 / 2) + 'px', top: (r.top + r.height / 2 - size0 / 2) + 'px' });
  document.body.appendChild(ghost);
  requestAnimationFrame(() => {
    const dx = target.left + target.width / 2 - (r.left + r.width / 2);
    const dy = target.top + target.height / 2 - (r.top + r.height / 2);
    ghost.style.transform = `translate(${dx}px, ${dy}px) scale(.12)`;
    ghost.style.opacity = '0.3';
  });
  setTimeout(() => { ghost.remove(); updateCount(true); }, 720);
}

function wireGallery(){
  const track = document.getElementById('track');
  if(!track) return;
  track.addEventListener('scroll', () => {
    const i = Math.round(track.scrollLeft / track.clientWidth);
    document.querySelectorAll('#dots span').forEach((d, n) => d.classList.toggle('on', n === i));
    document.querySelectorAll('.thumbs button').forEach((b, n) => b.classList.toggle('on', n === i));
  }, { passive: true });
}

let toastTimer;

// Fade content up as it enters the viewport (everything shows at once with reduced motion).
function reveal(){
  const els = document.querySelectorAll('.reveal');
  if(reduceMotion || !('IntersectionObserver' in window)){ els.forEach(e => e.classList.add('in')); return; }
  const io = new IntersectionObserver(entries => entries.forEach(e => {
    if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
  }), { rootMargin: '0px 0px -8% 0px' });
  els.forEach(e => io.observe(e));
}

// Phones: show the sticky buy bar once the main button has scrolled out of view.
function stickyBar(){

  addEventListener('scroll', () => { if(!queued){ queued = true; requestAnimationFrame(check); } }, { passive: true });
  check();
}

/* ---------- delivery estimate by pincode ---------- */
// No courier API yet, so this estimates from the pincode's region, shipping from Mumbai.
// Days are business days (Sundays skipped) and include 1–2 days to dispatch, matching the
// shipping policy's "dispatched in 1–2, delivered in 3–7 business days".
const METRO_PREFIXES = ['110', '560', '600', '700', '500', '411', '380', '122', '201'];
function transitDays(pin){
  const p3 = pin.slice(0, 3), p2 = pin.slice(0, 2);
  if(/^(400|401|410|421)/.test(pin)) return { min: 1, max: 2, zone: 'Mumbai region' };
  if(['78', '79', '18', '19'].includes(p2) || p3 === '744' || /^68255/.test(pin)) return { min: 5, max: 8, zone: 'Remote / North-East' };
  if(METRO_PREFIXES.includes(p3)) return { min: 2, max: 4, zone: 'Metro city' };
  if(p2 >= '40' && p2 <= '44' || p2 >= '36' && p2 <= '39') return { min: 2, max: 4, zone: 'West India' };
  return { min: 3, max: 5, zone: 'Rest of India' };
}
function addBusinessDays(d, n){
  const out = new Date(d);
  while(n > 0){ out.setDate(out.getDate() + 1); if(out.getDay() !== 0) n--; }
  return out;
}
function checkPin(e){
  if(e) e.preventDefault();
  const pin = document.getElementById('pin').value.trim();
  const out = document.getElementById('pinOut');
  if(!/^[1-8]\d{5}$/.test(pin)){ out.innerHTML = '<span style="color:var(--rust-bright)">Enter a valid 6-digit pincode</span>'; return; }
  try{ localStorage.setItem('egosynk_pincode', pin); } catch(err){}
  const t = transitDays(pin);
  const fmt = d => d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
  const now = new Date();
  out.innerHTML = `Delivery by <strong>${fmt(addBusinessDays(now, 1 + t.min))} – ${fmt(addBusinessDays(now, 2 + t.max))}</strong> to ${pin}
    <small>${esc(t.zone)} · estimate, exact date in your tracking once shipped</small>`;
  track('delivery_estimate', { zone: t.zone });
}

  try{ const pin = localStorage.getItem('egosynk_pincode'); if(pin){ document.getElementById('pin').value = pin; checkPin(); } } catch(e){}
  // consent.js loads deferred, so report the view once it's there.
  addEventListener('load', () => track('view_item', { currency: 'INR', value: P.price, items: [{ item_id: P.id, item_name: P.name, item_category: DATA.category && DATA.category.name, price: P.price }] }));
  stickyBar();
  const reviewOrder = new URLSearchParams(location.search).get('review');
  if(reviewOrder){ toggleReviewForm(true); document.getElementById('rv-order').value = reviewOrder; }
  if(size && !isFreeSize(P)) pickSize(size);
}
updateCount(false);
addEventListener('storage', () => updateCount(false)); // bag changed in another tab
</script>
<script src="/consent.js" defer></script>
</body>
</html>
