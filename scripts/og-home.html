<!doctype html>
<!-- Source for public/img/og-home.jpg (the homepage's WhatsApp / Instagram / X preview).
     Re-render: node scripts/render-og.mjs home -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#0d0e10;color:#edeae3;font-family:Inter,sans-serif;position:relative}
  .glow{position:absolute;inset:0;background:radial-gradient(45% 70% at 76% 52%,#3d0f16 0%,transparent 72%)}
  .lines{position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(237,234,227,.025) 22px 23px)}
  .copy{position:absolute;left:64px;top:64px;width:600px}
  .logo{font:400 30px 'Archivo Black';letter-spacing:.02em}
  .logo b{color:#c41e3a;font-weight:400}
  h1{font:400 92px/0.9 'Archivo Black';text-transform:uppercase;letter-spacing:-.02em;margin-top:58px}
  h1 span{color:#c41e3a}
  .sub{font:500 24px/1.4 Inter;color:#a8a6a0;margin-top:26px;max-width:520px}
  .chip{position:absolute;left:64px;bottom:58px;font:700 17px 'JetBrains Mono';letter-spacing:.12em;text-transform:uppercase;background:#c41e3a;padding:12px 18px;border-radius:2px}
  .tub{position:absolute;right:250px;top:46px;height:540px}
  .bold{position:absolute;right:-60px;top:190px;width:480px;-webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent 100%);mask-image:radial-gradient(closest-side,#000 62%,transparent 100%)}
</style></head><body>
<div class="glow"></div><div class="lines"></div>
<div class="copy">
  <div class="logo"><b>EGO</b>SYNK</div>
  <h1>Fuel. Gear.<br><span>Scent.</span></h1>
  <p class="sub">Pre-workout, compression gear and fragrance for lifters. Forged in Mumbai.</p>
</div>
<div class="chip">HYDRO 150 · Drop list open</div>
<img class="tub" src="../public/img/hydro-tub-34.webp" alt="">
<img class="bold" src="../public/img/bold-pair.webp" alt="">
</body></html>
