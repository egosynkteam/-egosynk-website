[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # @netlify/blobs requires Node 18+ (uses global fetch). This site predates the Blobs
  # code, so its function runtime may still default to an older Node version — pin it
  # explicitly rather than rely on the account default.
  NODE_VERSION = "20"

# The repo root is published, so source and tooling files would be downloadable; they're
# answered with a 404 instead. (Functions run from /.netlify/functions, not these paths.)
[[redirects]]
  from = "/netlify/*"
  to = "/not-found"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/not-found"
  status = 404
  force = true
[[redirects]]
  from = "/.github/*"
  to = "/not-found"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/not-found"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/not-found"
  status = 404
  force = true

# The original store page (bag, coupons, checkout) at a second address, so the new
# storefront can send /#bag and /?restore=<token> links here once it owns "/".
[[redirects]]
  from = "/shop.html"
  to = "/index.html"
  status = 200

# Product pages, server-rendered by netlify/functions/product-page.js. Values travel in
# the path, not a ?query on `to` — Netlify doesn't pass query params added in rewrites.
[[redirects]]
  from = "/p/:slug"
  to = "/.netlify/functions/product-page/:slug"
  status = 200
# Sitemap built from the live catalog (netlify/functions/sitemap.js).
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Google Merchant Center product feed (netlify/functions/merchant-feed.js).
[[redirects]]
  from = "/merchant-feed.xml"
  to = "/.netlify/functions/merchant-feed"
  status = 200
  force = true

# Admin-uploaded images, served by netlify/functions/media.js.
[[redirects]]
  from = "/media/:key"
  to = "/.netlify/functions/media/:key"
  status = 200
[[redirects]]
  from = "/og-image"
  to = "/.netlify/functions/media/og-image"
  status = 200

# Baseline security headers for every page. No Content-Security-Policy yet: the pages use
# inline scripts and Razorpay's checkout loads from several of its own domains, so a
# strict CSP needs the inline scripts moved out first.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Report-only for now: browsers log anything outside this list in the console without
    # blocking it. Once a few weeks pass with nothing unexpected, rename the header to
    # Content-Security-Policy to enforce it. 'unsafe-inline' stays until the inline scripts
    # move to files.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.facebook.com https://connect.facebook.net; frame-src https://api.razorpay.com https://checkout.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

# Pages with personal or admin data must never be indexed.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/invoice.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[functions]
  node_bundler = "esbuild"
  # product-page.js reads this template at runtime.
  included_files = ["product-template.html"]
  # pg (Supabase Postgres, lib/db.js) ships as a plain module: bundling it trips over its
  # optional native add-on (pg-native), which is never loaded.
  external_node_modules = ["pg"]

# Abandoned-checkout reminder emails (netlify/lib/abandoned.js), every 30 minutes.
[functions."abandoned-carts"]
  schedule = "*/30 * * * *"

# Deletes expired sessions, one-time links and old rate-limit records (netlify/lib/cleanup.js),
# daily at 03:00 IST (21:30 UTC).
[functions."nightly-cleanup"]
  schedule = "30 21 * * *"

# "How's the fit?" review requests a few days after delivery (netlify/lib/review-requests.js),
# daily at 11:00 IST (05:30 UTC).
[functions."review-requests"]
  schedule = "30 5 * * *"
